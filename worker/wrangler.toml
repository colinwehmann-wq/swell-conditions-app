# Cloudflare Worker for Swell Check profiles. Deploy from this folder with:  npx wrangler deploy
# Full walkthrough in README.md.

name = "swell-profiles"
main = "src/index.js"
compatibility_date = "2025-10-01"

# Where the stored profiles live. With no id given, wrangler creates this namespace the first time
# you deploy and fills the id in; if yours is older and complains, run
#   npx wrangler kv namespace create PROFILES
# and paste the id it prints here as `id = "..."`.
[[kv_namespaces]]
binding = "PROFILES"

[vars]
# Sites allowed to call the API from a browser (the live site, and a local preview).
ALLOWED_ORIGINS = "https://colinwehmann-wq.github.io,http://localhost:8000,http://localhost:8766"
# New profiles one address can make per hour.
CREATE_LIMIT_PER_HOUR = "10"

# Which workflow the 30-minute wake-up runs (see src/dispatch.js).
GITHUB_REPO = "colinwehmann-wq/swell-conditions-app"
GITHUB_WORKFLOW = "profile-alerts.yml"        # the personal alerts, every 30 minutes
GITHUB_SITE_WORKFLOW = "surf-check.yml"       # the site rebuild, hourly
GITHUB_REF = "main"

# Wake the alert job every 30 minutes. GitHub's own schedule drifts by hours on a quiet repository.
[triggers]
crons = ["*/30 * * * *"]

# Secrets, not variables. Set each with  npx wrangler secret put <NAME>
#   ADMIN_KEY             lets the alert job read every profile
#   GITHUB_DISPATCH_TOKEN a fine-grained GitHub token that can only run Actions on this repository
