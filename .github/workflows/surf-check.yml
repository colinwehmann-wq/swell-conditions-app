name: surf check

# Runs in GitHub's cloud on a schedule — your Mac can be off, asleep, anywhere.
# Cron is UTC. Pacific is UTC-7 (PDT, Mar–Nov) / UTC-8 (PST, Nov–Mar), so each
# local check is scheduled twice, an hour apart, to land near the right time
# year-round. GitHub's scheduler can run 5–20 min late under load.

on:
  schedule:
    - cron: "15 12 * * *"   # 05:15 PDT / 04:15 PST  — pre-dawn
    - cron: "15 13 * * *"   # 06:15 PDT / 05:15 PST  — dawn patrol
    - cron: "15 14 * * *"   # 07:15 PDT / 06:15 PST
    - cron: "30 17 * * *"   # 10:30 PDT / 09:30 PST  — mid-morning
    - cron: "0 22 * * *"    # 15:00 PDT / 14:00 PST  — afternoon
    - cron: "0 23 * * *"    # 16:00 PDT / 15:00 PST
  workflow_dispatch: {}      # "Run workflow" button on the Actions tab

concurrency:
  group: surf-check          # never let two runs overlap (they both push state)
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # to commit .state.json back to the repo
    steps:
      - uses: actions/checkout@v4

      - name: Run surf check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # optional: add SURF_WEBHOOK_URL as a secret too and uncomment
          # SURF_WEBHOOK_URL: ${{ secrets.SURF_WEBHOOK_URL }}
        run: python3 check.py --quiet

      - name: Persist alert state
        if: always()          # even if the check step reported no spots
        run: |
          git add -f .state.json 2>/dev/null || exit 0
          if ! git diff --cached --quiet; then
            git -c user.name="surf-check bot" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "update alert state [skip ci]"
            git push
          fi
