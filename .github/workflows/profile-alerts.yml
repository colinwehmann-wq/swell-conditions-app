name: profile alerts

# Every hour, read everyone's saved profile from the profile service (worker/) and send each person
# an alert about an hour before their ideal conditions peak at one of their breaks. Quiet when
# nobody has made a profile yet. See tools/profile_alerts.py and sources/profiles.py.
#
# Needs the repository secret PROFILES_ADMIN_KEY (the same key stored in the Worker as ADMIN_KEY).
# Without it the job does nothing and says so.
#
# The schedule below is only a backup. GitHub runs a quiet repository's cron every few hours at best,
# so the profile service's Worker wakes this workflow itself every 30 minutes (worker/src/dispatch.js)
# by calling workflow_dispatch with dry_run=false.
#
# The same run forwards any new site feedback (the "How was it?" buttons) to the owner's phone with
# tools/feedback_forward.py. It needs the NTFY_TOPIC secret already used by the site workflow, and it never logs
# what anyone wrote: this repository's Actions logs are public.

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the alerts instead of sending them (nothing is remembered either)"
        type: boolean
        default: true

concurrency:
  group: profile-alerts        # never two at once: they share the sent-alerts state
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Which alerts and which feedback have already gone out, so nothing is sent twice.
      - name: Restore sent-alerts state
        uses: actions/cache/restore@v4
        with:
          path: |
            .profile-state.json
            .feedback-state.json
          key: profile-state-${{ github.run_id }}
          restore-keys: profile-state-

      - name: Send profile alerts
        env:
          PROFILES_ADMIN_KEY: ${{ secrets.PROFILES_ADMIN_KEY }}
        run: python3 tools/profile_alerts.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Forward new feedback to the owner
        if: always()
        env:
          PROFILES_ADMIN_KEY: ${{ secrets.PROFILES_ADMIN_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 tools/feedback_forward.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Save sent-alerts state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .profile-state.json
            .feedback-state.json
          key: profile-state-${{ github.run_id }}
