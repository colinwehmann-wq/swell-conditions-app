name: surf check

# Runs in GitHub's cloud on a schedule — your Mac can be off, asleep, anywhere.
# Each run (1) checks conditions and sends any alerts, then (2) rebuilds the public
# website and deploys it to GitHub Pages.
#
# Cron is UTC. Pacific is UTC-7 (PDT, Mar–Nov) / UTC-8 (PST, Nov–Mar), so each
# local check is scheduled twice, an hour apart, to land near the right time
# year-round. GitHub's scheduler can run 5–20 min late under load.

on:
  schedule:
    - cron: "15 12 * * *"   # 05:15 PDT / 04:15 PST  — pre-dawn (also sends the digest)
    - cron: "15 13 * * *"   # 06:15 PDT / 05:15 PST  — dawn patrol
    - cron: "15 14 * * *"   # 07:15 PDT / 06:15 PST
    - cron: "30 17 * * *"   # 10:30 PDT / 09:30 PST  — mid-morning
    - cron: "0 22 * * *"    # 15:00 PDT / 14:00 PST  — afternoon
    - cron: "0 23 * * *"    # 16:00 PDT / 15:00 PST
  push:
    branches: [main]         # redeploy the site as soon as a change is merged
  workflow_dispatch:
    inputs:
      force:
        description: "Re-send alerts for every GO / upcoming-window spot (ignore dedupe) — for testing"
        type: boolean
        default: false
      digest:
        description: "Also send the digest — for testing (it fires automatically on the 05:15 run)"
        type: boolean
        default: false
      publish_public:
        description: "Also post to the PUBLIC website-subscriber topics (off by default so tests don't spam them)"
        type: boolean
        default: false

concurrency:
  group: surf-check          # never let two runs overlap (they share cached state)
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # only to append to the `forecast-log` branch; main is never written
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false   # don't leave a write-scoped token lying around for later steps

      # The forecast-accuracy log lives on its own orphan branch, not in the Actions cache
      # (which can be evicted) and not on main. See docs/FORECAST_PLAN.md.
      - name: Open forecast log
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir forecast-log
          cd forecast-log
          git init -q -b forecast-log
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin forecast-log >/dev/null 2>&1; then
            git fetch -q --depth=1 origin forecast-log
            git reset -q --hard FETCH_HEAD
          else
            echo "No forecast-log branch yet; this run starts it."
          fi

      # Alert-dedupe state lives in the Actions cache, not the repo. Each run
      # writes a new entry keyed by run id; restore-keys grabs the most recent.
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: .state.json
          key: surf-state-${{ github.run_id }}
          restore-keys: surf-state-

      - name: Run surf check and build site
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}   # optional: healthchecks.io ping URL
          # Public (website opt-in) topics only get posts from scheduled runs, or on request.
          SURF_PUBLISH_PUBLIC: ${{ (github.event_name == 'schedule' || inputs.publish_public) && '1' || '' }}
          # SURF_WEBHOOK_URL: ${{ secrets.SURF_WEBHOOK_URL }}
        run: python3 check.py --quiet --site _site --log-dir forecast-log ${{ (github.event.schedule == '15 12 * * *' || inputs.digest) && '--digest' || '' }} ${{ inputs.force && '--force' || '' }}

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state.json
          key: surf-state-${{ github.run_id }}

      # Commit this run's new log lines. A failure here is reported but never fails the run.
      - name: Save forecast log
        if: always()
        continue-on-error: true
        working-directory: forecast-log
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No new forecast log entries."
            exit 0
          fi
          git -c user.name="surf-check" -c user.email="surf-check@users.noreply.github.com" \
            commit -q -m "forecast log $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:forecast-log

      - name: Forecast skill report
        if: always()
        continue-on-error: true
        run: python3 tools/skill_report.py forecast-log >> "$GITHUB_STEP_SUMMARY"

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write           # publish to GitHub Pages
      id-token: write        # verify the deploy came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
